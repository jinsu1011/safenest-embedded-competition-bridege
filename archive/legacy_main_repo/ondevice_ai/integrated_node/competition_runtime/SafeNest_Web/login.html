<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeNest 관리자 로그인</title><style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui;color:#182235;background:#eef3f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));padding:38px;background:#fff;border-radius:20px;box-shadow:0 18px 50px #18324f1c}.brand{font-size:25px;font-weight:900;color:#0f2442}.brand i{display:inline-block;width:14px;height:14px;margin-right:9px;border-radius:50%;background:#20bd86}p{color:#6c7a91;line-height:1.6}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:800}input{width:100%;padding:13px;border:1px solid #d9e2ec;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#1769d2;color:white;font-weight:800;cursor:pointer}.error{min-height:22px;margin-top:12px;color:#d83c4d;font-size:13px}.hint{padding:11px;background:#f6f8fb;border-radius:9px;font-size:12px}
</style></head><body><main class="box"><div class="brand"><i></i>SafeNest</div><h1>관리자 로그인</h1><p>공간과 센서 노드를 관리하려면 로그인하세요.</p><form id="form"><label for="id">관리자 ID</label><input id="id" autocomplete="username" required value="admin"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required><button>로그인</button><div class="error" id="error"></div></form><p class="hint">초기 개발 계정은 <b>admin / SafeNest123!</b> 입니다. 운영 전 반드시 .env에서 변경하세요.</p></main><script>
if(sessionStorage.getItem('safenest-token')) location.replace('/admin');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:id.value,password:pw.value})});const d=await r.json();if(!r.ok)throw Error(d.error);sessionStorage.setItem('safenest-token',d.token);location.replace('/admin')}catch(x){error.textContent=x.message||'로그인할 수 없습니다.'}});
</script></body></html>
