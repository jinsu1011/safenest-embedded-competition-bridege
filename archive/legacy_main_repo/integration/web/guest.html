<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeNest 공간 현황</title><style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui;color:#182235;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{padding:20px clamp(18px,5vw,64px);background:#102642;color:white;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}main{max-width:1080px;margin:auto;padding:32px 18px}.hero,.card{background:white;border:1px solid #dde6ef;border-radius:18px;box-shadow:0 10px 30px #18324f0d}.hero{padding:28px;margin-bottom:18px}.hero h1{margin:5px 0}.muted{color:#718096}.status{display:inline-block;padding:7px 11px;border-radius:99px;background:#e8f8f2;color:#087c54;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:22px}.card span{font-size:12px;color:#718096}.card strong{display:block;margin-top:8px;font-size:27px}.thermal-card{grid-column:1/-1;padding:18px}.thermal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.thermal-head h2{margin:0;font-size:18px}.thermal-viewer{height:min(55vw,500px);min-height:280px;position:relative;overflow:hidden;background:linear-gradient(135deg,#14113e,#4c217b,#111a30);border-radius:14px}.thermal-viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.thermal-state{color:#718096;font-size:13px}.notice{margin-top:18px;padding:14px;border-radius:10px;background:#fff7df;color:#815d00}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.thermal-viewer{height:360px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.thermal-card{grid-column:1}.thermal-viewer{height:300px}}
</style></head><body><header><b>SafeNest</b><span>공용 공간 모니터링</span></header><main>
<section class="hero"><span class="muted">QR 전용 실시간 대시보드</span><h1 id="name">공간 정보를 불러오는 중</h1><span class="status" id="status">연결 확인 중</span><p class="muted" id="updated"></p></section>
<section class="grid">
  <article class="card"><span>CO₂ 농도</span><strong id="co2">-</strong></article>
  <article class="card"><span>호흡수</span><strong id="breath">-</strong></article>
  <article class="card"><span>심박수</span><strong id="heart">-</strong></article>
  <article class="card"><span>열화상 최고온도</span><strong id="bodyTemp">-</strong></article>
  <article class="card"><span>PIR 움직임</span><strong id="motion">-</strong></article>
  <article class="card"><span>무움직임 시간</span><strong id="motionless">-</strong></article>
  <article class="card"><span>통합 위험점수</span><strong id="risk">-</strong></article>
  <article class="card"><span>센서 노드</span><strong id="device">-</strong></article>
  <article class="card thermal-card"><div class="thermal-head"><h2>실시간 열화상 · 80×62</h2><span class="thermal-state" id="guestThermalStatus">Raspberry Pi 프레임 대기</span></div><div class="thermal-viewer" id="thermalPanel"><canvas id="thermalCanvas" width="800" height="620" aria-label="실시간 열화상"></canvas></div></article>
</section>
<div class="notice">이 화면은 조회 전용입니다. 공간 관리와 설정은 관리자 로그인이 필요합니다.</div></main>
<script>
const spaceId=decodeURIComponent(location.pathname.split('/').pop());document.body.dataset.spaceId=spaceId;
const labels={'normal-empty':'정상 · 비어 있음','normal-occupied':'정상 · 재실','warning':'주의','danger':'위험','emergency':'긴급','offline':'통신 오류'};
async function load(){const response=await fetch('/api/spaces/'+encodeURIComponent(spaceId));if(!response.ok){document.getElementById('name').textContent='공간을 찾을 수 없습니다';return}const s=await response.json(),v=s.reading||{};document.getElementById('name').textContent=s.name;document.getElementById('status').textContent=labels[s.status]||s.status;document.getElementById('co2').textContent=v.co2==null?'-':Math.round(v.co2).toLocaleString()+' ppm';document.getElementById('breath').textContent=v.breathRate==null?'-':Number(v.breathRate).toFixed(1)+' rpm';document.getElementById('heart').textContent=v.heartRate==null?'-':Number(v.heartRate).toFixed(1)+' bpm';const max=v.thermal?.maxC??v.bodyTemperature;document.getElementById('bodyTemp').textContent=max==null?'-':Number(max).toFixed(1)+'℃';document.getElementById('motion').textContent=v.motion?'감지됨':'감지 안 됨';document.getElementById('motionless').textContent=(v.motionlessSeconds??0)+'초';document.getElementById('risk').textContent=(s.risk??'-')+'/100';document.getElementById('device').textContent=s.bridge?.deviceId||s.nodeId;document.getElementById('updated').textContent='최근 수신: '+new Date(s.lastSeen).toLocaleString('ko-KR')}
load();const es=new EventSource('/api/stream');es.addEventListener('sensor.updated',event=>{if(JSON.parse(event.data).id===spaceId)load()});
</script><script src="/thermal-client.js"></script></body></html>
