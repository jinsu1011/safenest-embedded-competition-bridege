# SafeNest V4 On-Device AI Models Configuration

models:
  thermal:
    model_id: "thermal_public_sdt_pooled_mlp_fp32_tflite_v1"
    version: "b6r_p2_fp32_v1"
    path: "models/thermal/public_sdt/public_sdt_pooled_mlp_fp32_tflite_v1.tflite"
    metadata_path: "models/thermal/public_sdt/public_sdt_pooled_mlp_fp32_tflite_v1.metadata.json"
    framework: "tflite"
    quantization: "none_fp32"
    runtime_role: "ACTIVE_THERMAL_PUBLIC_SDT_SOFTWARE_ONLY"
    active_runtime_selector: true
    artifact_release: "FINAL_RUNTIME_MODEL"
    safety_authority: false
    risk_authority: "LIMITED_POSTURE_PROXY"
    proxy_risk_score: 0.4
    input:
      shape: [1, 62, 80, 1]
      dtype: "float32"
    output:
      shape: [1, 3]
      dtype: "float32"
    class_map:
      0: "NOT_HUMAN"
      1: "HUMAN_NORMAL"
      2: "HUMAN_FALL_PROXY"

  mmwave:
    model_id: "MMWAVE_M_N9_FULL_INT8_V1"
    version: "m_n9_full_int8_v1"
    path: "models/mmwave/m_n9/MMWAVE_M_N9_FULL_INT8_V1.tflite"
    lock_path: "config/mmwave/m_n9_full_int8_artifact_lock.json"
    framework: "tflite"
    quantization: "int8"
    input:
      shape: [1, 240, 1]
      dtype: "int8"
      scale: 0.5623255372047424
      zero_point: 4
    output:
      shape: [1, 3]
      dtype: "int8"
      scale: 0.00390625
      zero_point: -128
    class_map:
      0: "NORMAL"
      1: "RAPID_OR_ABNORMAL"
      2: "APNEA"

  co2:
    model_id: "co2_occupancy_int8"
    version: "0.1.0"
    path: "models/co2/co2_occupancy_int8_v0.1.0.tflite"
    scaler_path: "models/co2/co2_scaling_metadata_v0.1.0.json"
    framework: "tflite"
    quantization: "int8"
    input:
      shape: [1, 3]
      dtype: "int8"
      scale: 0.005828449968248606
      zero_point: 57
    output:
      shape: [1, 2]
      dtype: "int8"
      scale: 0.00390625
      zero_point: -128
    features:
      - "CO2_slope"
      - "Humidity"
      - "CO2"
    class_map:
      0: "VACANT"
      1: "OCCUPIED"
